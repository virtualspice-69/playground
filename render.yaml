# Render Blueprint — deploys the eBay Auto-Drafter web app.
# In Render: New + → Blueprint → connect this repo → it reads this file.
# Set ANTHROPIC_API_KEY (and optionally the Google keys) in the dashboard.
services:
  - type: web
    name: ebay-autodrafter
    runtime: node
    rootDir: autodrafter
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
