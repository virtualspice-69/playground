<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6e4f">
<title>eBay Auto-Drafter</title>
<style>
  :root {
    --bg: #f1f3ef; --card: #ffffff; --ink: #20262a; --muted: #67717a;
    --accent: #0b6e4f; --on-accent: #f4faf7; --line: #e0e4de;
    --warn-ink: #8a5a0a; --warn-bg: #f8edd8; --chip: #e9efe9; --danger: #b3382e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131714; --card: #1c221e; --ink: #e6eae5; --muted: #98a29b;
      --accent: #49b586; --on-accent: #0d1710; --line: #2b332d;
      --warn-ink: #e8c069; --warn-bg: #33290f; --chip: #253028; --danger: #e5766c;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }

  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
  .head-in { max-width: 1060px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
  .mark { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-size: 19px; flex: none; }
  .head-in h1 { font-size: 17px; margin: 0; letter-spacing: -0.01em; }
  .head-in .tag { font-size: 11.5px; color: var(--muted); }
  .head-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .lang { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .status { font-size: 12px; padding: 5px 10px; border-radius: 99px; background: var(--warn-bg); color: var(--warn-ink); white-space: nowrap; }
  .status.ok { background: var(--chip); color: var(--accent); }

  .shell { max-width: 1060px; margin: 0 auto; padding: 16px 16px 80px; display: grid; gap: 16px; grid-template-columns: 1fr; }
  @media (min-width: 920px) {
    .shell { grid-template-columns: 400px 1fr; align-items: start; }
    .capture { position: sticky; top: 76px; }
  }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  label { display: block; font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 6px; }
  input[type=text] { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font-size: 16px; }
  input[type=text]:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .photos { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .thumb { position: relative; width: 70px; height: 70px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb button { position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border: 0; border-radius: 50%; background: rgba(10,14,12,.7); color: #fff; font-size: 13px; line-height: 1; cursor: pointer; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; margin-top: 12px; border: 0; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-size: 16px; font-weight: 700; cursor: pointer; }
  .btn[disabled] { opacity: .45; cursor: default; }
  .btn.ghost { background: transparent; color: var(--accent); border: 1.5px dashed var(--accent); font-weight: 600; }
  .drop { margin-top: 12px; border: 1.5px dashed var(--line); border-radius: 12px; padding: 10px; text-align: center; font-size: 13px; color: var(--muted); display: none; }
  @media (min-width: 920px) { .drop { display: block; } .drop.over { border-color: var(--accent); color: var(--accent); } }

  .feed-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .feed-bar strong { font-size: 15px; }
  .feed-bar a { color: var(--accent); font-size: 14px; }
  .feed { display: flex; flex-direction: column; gap: 14px; }

  .draft h3 { margin: 0; font-size: 17px; line-height: 1.3; text-wrap: balance; }
  .pricerow { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 8px 0 2px; }
  .price { font-size: 22px; font-weight: 800; color: var(--accent); }
  .range { font-size: 13px; color: var(--muted); }
  .kv { display: grid; grid-template-columns: 108px 1fr; gap: 5px 12px; font-size: 14px; margin: 12px 0 0; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
  .desc { white-space: pre-wrap; font-size: 14px; border-top: 1px solid var(--line); margin-top: 12px; padding-top: 12px; }
  .verify { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--warn-bg); color: var(--warn-ink); font-size: 13px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
  .chipbtn { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 99px; padding: 7px 13px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .chipbtn:active { background: var(--chip); }
  .chipbtn.del { color: var(--danger); margin-left: auto; }
  .dthumbs { display: flex; gap: 6px; margin-top: 12px; }
  .dthumbs img { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; border: 1px solid var(--line); }

  .row-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .row-item:last-child { border-bottom: 0; }
  .row-item img, .row-item .noimg { width: 44px; height: 44px; border-radius: 9px; object-fit: cover; border: 1px solid var(--line); flex: none; }
  .row-item .noimg { display: grid; place-items: center; background: var(--chip); font-size: 18px; }
  .row-item .t { font-size: 14px; line-height: 1.35; flex: 1; min-width: 0; }
  .row-item .t small { display: block; color: var(--muted); }
  .row-item .p { color: var(--accent); font-weight: 700; white-space: nowrap; }

  .spin { width: 18px; height: 18px; border: 2.5px solid var(--on-accent); border-top-color: transparent; border-radius: 50%; animation: r .8s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

  #toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 99px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 20; max-width: 90vw; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <div class="head-in">
    <div class="mark">📦</div>
    <div>
      <h1 data-i18n="title">eBay Auto-Drafter</h1>
      <div class="tag" data-i18n="tagline">Photos in → draft listings out</div>
    </div>
    <div class="head-right">
      <span class="status" id="status">…</span>
      <button class="lang" id="lang" aria-label="Language">ES</button>
    </div>
  </div>
</header>

<div class="shell">
  <div class="capture">
    <div class="card">
      <label for="name" data-i18n="nameLabel">Item name — hint for the AI</label>
      <input type="text" id="name" autocomplete="off" data-i18n-ph="namePh" placeholder='e.g. "nike hoodie XL"'>
      <input type="file" id="file" accept="image/*" multiple hidden>
      <button class="btn ghost" id="add">📷 <span data-i18n="addPhotos">Add photos</span></button>
      <div class="drop" id="drop" data-i18n="drop">…or drag photos here</div>
      <div class="photos" id="photos"></div>
      <button class="btn" id="go" disabled><span data-i18n="create">Create draft</span></button>
    </div>
  </div>

  <div>
    <div class="feed-bar">
      <strong><span data-i18n="drafts">Drafts</span> <span class="mono" id="count"></span></strong>
      <a href="/api/drafts.csv" data-i18n="csv">Download CSV</a>
    </div>
    <div class="feed" id="feed">
      <div class="card" id="empty" style="color:var(--muted);font-size:14px" data-i18n="empty">
        No drafts yet. Add photos of an item and tap Create draft.
      </div>
    </div>
  </div>
</div>

<div id="toast" role="status"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- i18n ---------- */
const STR = {
  en: {
    title: "eBay Auto-Drafter", tagline: "Photos in → draft listings out",
    nameLabel: "Item name — hint for the AI", namePh: 'e.g. "nike hoodie XL"',
    addPhotos: "Add photos", drop: "…or drag photos here", create: "Create draft",
    drafting: "Drafting… (can take a minute)", drafts: "Drafts", csv: "Download CSV",
    empty: "No drafts yet. Add photos of an item and tap Create draft.",
    live: "✅ Live AI", mock: "🧪 Mock mode — set ANTHROPIC_API_KEY for real drafts",
    condition: "Condition", category: "Category", brand: "Brand", flaws: "Flaws",
    verify: "Verify before publishing", copyTitle: "Copy title", copyDesc: "Copy description",
    copyAll: "Copy all", del: "Delete", copied: "Copied ✓", deleted: "Draft deleted",
    failed: "Draft failed: ", confirmDel: "Delete this draft?", range: "range",
  },
  es: {
    title: "eBay Auto-Drafter", tagline: "Fotos → borradores de anuncios",
    nameLabel: "Nombre del artículo — pista para la IA", namePh: 'ej. "sudadera nike XL"',
    addPhotos: "Agregar fotos", drop: "…o arrastra fotos aquí", create: "Crear borrador",
    drafting: "Creando… (puede tardar un minuto)", drafts: "Borradores", csv: "Descargar CSV",
    empty: "Aún no hay borradores. Agrega fotos de un artículo y toca Crear borrador.",
    live: "✅ IA activa", mock: "🧪 Modo de prueba — configura ANTHROPIC_API_KEY para borradores reales",
    condition: "Condición", category: "Categoría", brand: "Marca", flaws: "Defectos",
    verify: "Verificar antes de publicar", copyTitle: "Copiar título", copyDesc: "Copiar descripción",
    copyAll: "Copiar todo", del: "Eliminar", copied: "Copiado ✓", deleted: "Borrador eliminado",
    failed: "Error al crear: ", confirmDel: "¿Eliminar este borrador?", range: "rango",
  },
};
let lang = localStorage.getItem("lang") || "en";
const t = (k) => (STR[lang] && STR[lang][k]) || STR.en[k] || k;
function applyLang() {
  document.documentElement.lang = lang;
  $("lang").textContent = lang === "en" ? "ES" : "EN";
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-ph]").forEach((el) => { el.placeholder = t(el.dataset.i18nPh); });
  renderStatus();
  loadFeed();
}
$("lang").onclick = () => { lang = lang === "en" ? "es" : "en"; localStorage.setItem("lang", lang); applyLang(); };

/* ---------- toast ---------- */
let toastTimer;
function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}

/* ---------- status ---------- */
let serverStatus = null;
async function fetchStatus() {
  try { serverStatus = await (await fetch("/api/status")).json(); } catch {}
  renderStatus();
}
function renderStatus() {
  const el = $("status");
  if (!serverStatus) { el.textContent = "…"; return; }
  const live = serverStatus.hasApiKey && !serverStatus.mockDefault;
  el.className = "status" + (live ? " ok" : "");
  el.textContent = live ? t("live") : t("mock");
}

/* ---------- photos ---------- */
let photos = []; // {media_type, data, dataUrl, name}
function renderPhotos() {
  const p = $("photos");
  p.innerHTML = "";
  photos.forEach((ph, i) => {
    const d = document.createElement("div");
    d.className = "thumb";
    d.innerHTML = `<img src="${ph.dataUrl}" alt=""><button aria-label="Remove">×</button>`;
    d.querySelector("button").onclick = () => { photos.splice(i, 1); renderPhotos(); };
    p.appendChild(d);
  });
  $("go").disabled = photos.length === 0;
}
function downscale(file, max, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(img.width * scale));
      c.height = Math.max(1, Math.round(img.height * scale));
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      const dataUrl = c.toDataURL("image/jpeg", quality);
      URL.revokeObjectURL(img.src);
      resolve(dataUrl);
    };
    img.onerror = () => { URL.revokeObjectURL(img.src); reject(new Error("bad image")); };
    img.src = URL.createObjectURL(file);
  });
}
async function addFiles(files) {
  for (const f of [...files].slice(0, 12 - photos.length)) {
    try {
      const dataUrl = await downscale(f, 1568, 0.85);
      photos.push({ media_type: "image/jpeg", data: dataUrl.split(",")[1], dataUrl, name: f.name });
    } catch {}
  }
  renderPhotos();
}
$("add").onclick = () => $("file").click();
$("file").onchange = (e) => { addFiles(e.target.files); e.target.value = ""; };
const drop = $("drop");
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); addFiles(e.dataTransfer.files); };
$("name").addEventListener("keydown", (e) => { if (e.key === "Enter" && !$("go").disabled) $("go").click(); });

/* ---------- draft card ---------- */
function draftText(d) {
  const specs = d.item_specifics.map((s) => `${s.name}: ${s.value}`).join("\n");
  return `${d.title}\n\n$${d.price.suggested} (${d.price.low}–${d.price.high})\n${t("condition")}: ${d.condition}\n${t("category")}: ${d.category}\n${specs}\n\n${d.description}`;
}
function copy(text, btn) {
  navigator.clipboard.writeText(text).then(
    () => toast(t("copied")),
    () => { // clipboard API needs HTTPS or localhost; fall back for LAN-IP pages
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); ta.remove(); toast(t("copied"));
    },
  );
}
function draftCard(item, d, mock) {
  const el = document.createElement("div");
  el.className = "card draft";
  const specs = d.item_specifics.map((s) => `<dt>${esc(s.name)}</dt><dd>${esc(s.value)}</dd>`).join("");
  const flaws = d.flaws && d.flaws.length ? `<dt>${t("flaws")}</dt><dd>${esc(d.flaws.join("; "))}</dd>` : "";
  const thumb = d._meta && d._meta.thumb ? `<div class="dthumbs"><img src="${d._meta.thumb}" alt=""></div>` : "";
  el.innerHTML = `
    <h3>${esc(d.title)}</h3>
    <div class="pricerow"><span class="price mono">$${d.price.suggested}</span>
      <span class="range mono">${t("range")} $${d.price.low}–$${d.price.high}${mock ? " · mock" : ""}</span></div>
    <dl class="kv"><dt>${t("condition")}</dt><dd>${esc(d.condition)}</dd>
      <dt>${t("category")}</dt><dd>${esc(d.category)}</dd>
      <dt>${t("brand")}</dt><dd>${esc(d.brand)}</dd>${specs}${flaws}</dl>
    ${thumb}
    <div class="desc">${esc(d.description)}</div>
    ${d.confidence_notes ? `<div class="verify">⚠️ ${t("verify")}: ${esc(d.confidence_notes)}</div>` : ""}
    <div class="actions">
      <button class="chipbtn" data-a="title">📋 ${t("copyTitle")}</button>
      <button class="chipbtn" data-a="desc">📋 ${t("copyDesc")}</button>
      <button class="chipbtn" data-a="all">📋 ${t("copyAll")}</button>
      <button class="chipbtn del" data-a="del">🗑 ${t("del")}</button>
    </div>`;
  el.querySelector('[data-a="title"]').onclick = () => copy(d.title);
  el.querySelector('[data-a="desc"]').onclick = () => copy(d.description);
  el.querySelector('[data-a="all"]').onclick = () => copy(draftText(d));
  el.querySelector('[data-a="del"]').onclick = async () => {
    if (!confirm(t("confirmDel"))) return;
    await fetch("/api/drafts/" + encodeURIComponent(item), { method: "DELETE" });
    toast(t("deleted"));
    loadFeed();
  };
  return el;
}

/* ---------- feed ---------- */
async function loadFeed() {
  try {
    const { drafts } = await (await fetch("/api/drafts")).json();
    const feed = $("feed");
    feed.innerHTML = "";
    $("count").textContent = drafts.length ? `(${drafts.length})` : "";
    if (!drafts.length) {
      feed.innerHTML = `<div class="card" style="color:var(--muted);font-size:14px">${esc(t("empty"))}</div>`;
      return;
    }
    for (const { item, draft } of drafts) feed.appendChild(draftCard(item, draft, draft._meta?.model === "mock"));
  } catch {}
}

/* ---------- create ---------- */
$("go").onclick = async () => {
  const btn = $("go");
  btn.disabled = true;
  btn.innerHTML = `<span class="spin"></span>&nbsp;${esc(t("drafting"))}`;
  try {
    const thumb = photos[0] ? await shrinkDataUrl(photos[0].dataUrl) : null;
    const r = await fetch("/api/draft", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        name: $("name").value,
        thumb,
        photos: photos.map((p) => ({ media_type: p.media_type, data: p.data, name: p.name })),
      }),
    });
    const out = await r.json();
    if (!r.ok) throw new Error(out.error || r.statusText);
    photos = [];
    $("name").value = "";
    renderPhotos();
    await loadFeed();
    window.scrollTo({ top: 0, behavior: "smooth" });
  } catch (err) {
    toast(t("failed") + err.message);
  } finally {
    btn.disabled = photos.length === 0;
    btn.innerHTML = `<span>${esc(t("create"))}</span>`;
  }
};
function shrinkDataUrl(dataUrl) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const MAX = 160;
      const scale = Math.min(1, MAX / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(img.width * scale));
      c.height = Math.max(1, Math.round(img.height * scale));
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL("image/jpeg", 0.7));
    };
    img.onerror = () => resolve(null);
    img.src = dataUrl;
  });
}

applyLang();
fetchStatus();
</script>
</body>
</html>
