<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>eBay Auto-Drafter</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #1e2126; --muted: #6b7280;
    --accent: #0a6847; --accent-ink: #ffffff; --line: #e4e2dc; --warn: #92400e; --warn-bg: #fef3c7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --card: #1e2128; --ink: #e8e8e4; --muted: #9aa1ab;
      --accent: #2f9e70; --accent-ink: #0c130f; --line: #2c3038; --warn: #fcd34d; --warn-bg: #3a2e10;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 64px; }
  h1 { font-size: 22px; margin: 8px 0 2px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  input[type=text] { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font-size: 16px; }
  .photos { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .thumb { position: relative; width: 72px; height: 72px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb button { position: absolute; top: 2px; right: 2px; width: 22px; height: 22px; border: 0; border-radius: 50%; background: rgba(0,0,0,.65); color: #fff; font-size: 13px; line-height: 1; cursor: pointer; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; margin-top: 12px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-size: 17px; font-weight: 700; cursor: pointer; }
  .btn[disabled] { opacity: .5; }
  .btn.secondary { background: transparent; color: var(--accent); border: 1.5px dashed var(--accent); font-weight: 600; }
  .banner { font-size: 13px; padding: 10px 12px; border-radius: 10px; margin-bottom: 14px; background: var(--warn-bg); color: var(--warn); }
  .banner.ok { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
  .draft h3 { margin: 0 0 4px; font-size: 17px; }
  .price { font-size: 20px; font-weight: 800; color: var(--accent); }
  .meta { color: var(--muted); font-size: 13px; }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 4px 10px; font-size: 14px; margin: 10px 0; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; }
  .desc { white-space: pre-wrap; font-size: 14px; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; }
  .verify { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); font-size: 13px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  a { color: var(--accent); }
  .spin { display: inline-block; width: 18px; height: 18px; border: 2.5px solid var(--accent-ink); border-top-color: transparent; border-radius: 50%; animation: r 0.8s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <h1>📦 eBay Auto-Drafter</h1>
  <p class="sub">Snap photos → get a draft listing. Review, then publish &amp; crosslist.</p>
  <div id="banner" class="banner" hidden></div>

  <div class="card">
    <label for="name">Item name (helps the AI — e.g. “nike hoodie XL”)</label>
    <input type="text" id="name" placeholder="What is this item?" autocomplete="off">
    <input type="file" id="file" accept="image/*" multiple hidden>
    <button class="btn secondary" id="add">📷 Add photos</button>
    <div class="photos" id="photos"></div>
    <button class="btn" id="go" disabled>Create draft</button>
  </div>

  <div id="result"></div>

  <div class="card">
    <div class="row">
      <strong>Saved drafts</strong>
      <a href="/api/drafts.csv">Download CSV</a>
    </div>
    <div id="list" class="meta">Loading…</div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let photos = []; // {media_type, data, dataUrl, name}

async function status() {
  try {
    const s = await (await fetch("/api/status")).json();
    const b = $("banner");
    b.hidden = false;
    if (s.hasApiKey && !s.mockDefault) { b.className = "banner ok"; b.textContent = "✅ Live mode — photos are analyzed by Claude."; }
    else { b.textContent = "🧪 Mock mode — no API key on the server, drafts are placeholders. Set ANTHROPIC_API_KEY and restart for real drafts."; }
  } catch {}
}

function render() {
  const p = $("photos");
  p.innerHTML = "";
  photos.forEach((ph, i) => {
    const d = document.createElement("div");
    d.className = "thumb";
    d.innerHTML = `<img src="${ph.dataUrl}" alt=""><button title="Remove">×</button>`;
    d.querySelector("button").onclick = () => { photos.splice(i, 1); render(); };
    p.appendChild(d);
  });
  $("go").disabled = photos.length === 0;
}

function downscale(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const MAX = 1568;
      const scale = Math.min(1, MAX / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      const dataUrl = c.toDataURL("image/jpeg", 0.85);
      URL.revokeObjectURL(img.src);
      resolve({ media_type: "image/jpeg", data: dataUrl.split(",")[1], dataUrl, name: file.name });
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

$("add").onclick = () => $("file").click();
$("file").onchange = async (e) => {
  for (const f of [...e.target.files].slice(0, 12 - photos.length)) {
    try { photos.push(await downscale(f)); } catch {}
  }
  e.target.value = "";
  render();
};

function draftCard({ item, draft, mock }) {
  const specs = draft.item_specifics.map((s) => `<dt>${esc(s.name)}</dt><dd>${esc(s.value)}</dd>`).join("");
  const flaws = draft.flaws.length ? `<dt>Flaws</dt><dd>${esc(draft.flaws.join("; "))}</dd>` : "";
  return `<div class="card draft">
    <div class="row"><h3>${esc(draft.title)}</h3></div>
    <div class="row"><span class="price">$${draft.price.suggested}</span>
      <span class="meta">range $${draft.price.low}–$${draft.price.high}${mock ? " · mock" : ""}</span></div>
    <dl class="kv"><dt>Condition</dt><dd>${esc(draft.condition)}</dd>
      <dt>Category</dt><dd>${esc(draft.category)}</dd>
      <dt>Brand</dt><dd>${esc(draft.brand)}</dd>${specs}${flaws}</dl>
    <div class="desc">${esc(draft.description)}</div>
    ${draft.confidence_notes ? `<div class="verify">⚠️ Verify before publishing: ${esc(draft.confidence_notes)}</div>` : ""}
  </div>`;
}
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

$("go").onclick = async () => {
  const btn = $("go");
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> Drafting… (can take a minute)';
  try {
    const r = await fetch("/api/draft", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        name: $("name").value,
        photos: photos.map((p) => ({ media_type: p.media_type, data: p.data, name: p.name })),
      }),
    });
    const out = await r.json();
    if (!r.ok) throw new Error(out.error || r.statusText);
    $("result").innerHTML = draftCard(out) + $("result").innerHTML;
    photos = [];
    $("name").value = "";
    render();
    loadList();
  } catch (err) {
    alert("Draft failed: " + err.message);
  } finally {
    btn.disabled = photos.length === 0;
    btn.textContent = "Create draft";
  }
};

async function loadList() {
  try {
    const { drafts } = await (await fetch("/api/drafts")).json();
    $("list").innerHTML = drafts.length
      ? drafts.map((d) => `• ${esc(d.draft.title)} — $${d.draft.price.suggested}`).join("<br>")
      : "No drafts yet.";
  } catch { $("list").textContent = "Could not load drafts."; }
}

status(); render(); loadList();
</script>
</body>
</html>
