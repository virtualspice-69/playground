<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6e4f">
<title>eBay Auto-Drafter</title>
<style>
  :root {
    --bg: #f1f3ef; --card: #ffffff; --ink: #20262a; --muted: #67717a;
    --accent: #0b6e4f; --on-accent: #f4faf7; --line: #e0e4de;
    --warn-ink: #8a5a0a; --warn-bg: #f8edd8; --chip: #e9efe9; --danger: #b3382e;
    --gphotos: #4285f4; --gdrive: #1fa463;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131714; --card: #1c221e; --ink: #e6eae5; --muted: #98a29b;
      --accent: #49b586; --on-accent: #0d1710; --line: #2b332d;
      --warn-ink: #e8c069; --warn-bg: #33290f; --chip: #253028; --danger: #e5766c;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
  .hidden { display: none !important; }

  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
  .head-in { max-width: 1060px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
  .mark { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-size: 19px; flex: none; }
  .head-in h1 { font-size: 17px; margin: 0; letter-spacing: -0.01em; }
  .head-in .tag { font-size: 11.5px; color: var(--muted); }
  .head-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .lang, .linkbtn { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .linkbtn { border: 0; background: transparent; color: var(--muted); }
  .status { font-size: 12px; padding: 5px 10px; border-radius: 99px; background: var(--warn-bg); color: var(--warn-ink); white-space: nowrap; }
  .status.ok { background: var(--chip); color: var(--accent); }
  .who { font-size: 12.5px; color: var(--muted); max-width: 34vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .shell { max-width: 1060px; margin: 0 auto; padding: 16px 16px 80px; display: grid; gap: 16px; grid-template-columns: 1fr; }
  @media (min-width: 920px) {
    .app-grid { grid-template-columns: 400px 1fr; align-items: start; }
    .capture { position: sticky; top: 76px; }
  }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  label { display: block; font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 6px; }
  input[type=text], input[type=email], input[type=password] { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font-size: 16px; }
  input:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .field { margin-bottom: 12px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; border: 0; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-size: 16px; font-weight: 700; cursor: pointer; }
  .btn[disabled] { opacity: .45; cursor: default; }
  .btn.ghost { background: transparent; color: var(--accent); border: 1.5px dashed var(--accent); font-weight: 600; margin-top: 12px; }
  .btn.small { padding: 11px; font-size: 15px; }
  .err { color: var(--danger); font-size: 13.5px; margin: 4px 0 0; min-height: 0; }
  .ok-msg { color: var(--accent); font-size: 13.5px; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); margin: 4px 0 12px; cursor: pointer; }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); }

  /* auth gate */
  .authwrap { max-width: 420px; margin: 6vh auto 0; }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tab { flex: 1; padding: 11px; border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 10px; font-weight: 650; cursor: pointer; }
  .tab.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .fineprint { font-size: 12px; color: var(--muted); margin-top: 14px; line-height: 1.5; text-align: center; }

  /* google buttons */
  .gbtns { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; margin-bottom: 14px; }
  .gbtn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; border-radius: 11px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-weight: 650; font-size: 14px; cursor: pointer; }
  .gbtn .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .gbtn.connected .dot { background: var(--accent); }
  .gbtn.photos:hover { border-color: var(--gphotos); }
  .gbtn.drive:hover { border-color: var(--gdrive); }
  .gnote { font-size: 12px; color: var(--muted); margin: -6px 0 14px; }

  .photos { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .thumb { position: relative; width: 70px; height: 70px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb button { position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border: 0; border-radius: 50%; background: rgba(10,14,12,.7); color: #fff; font-size: 13px; cursor: pointer; }

  .feed-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .feed-bar a { color: var(--accent); font-size: 14px; }
  .feed { display: flex; flex-direction: column; gap: 14px; }
  .draft h3 { margin: 0; font-size: 17px; line-height: 1.3; text-wrap: balance; }
  .pricerow { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 8px 0 2px; }
  .price { font-size: 22px; font-weight: 800; color: var(--accent); }
  .range { font-size: 13px; color: var(--muted); }
  .kv { display: grid; grid-template-columns: 108px 1fr; gap: 5px 12px; font-size: 14px; margin: 12px 0 0; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
  .desc { white-space: pre-wrap; font-size: 14px; border-top: 1px solid var(--line); margin-top: 12px; padding-top: 12px; }
  .verify { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--warn-bg); color: var(--warn-ink); font-size: 13px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
  .chipbtn { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 99px; padding: 7px 13px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .chipbtn.del { color: var(--danger); margin-left: auto; }
  .dthumbs { display: flex; gap: 6px; margin-top: 12px; }
  .dthumbs img { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; border: 1px solid var(--line); }

  .spin { width: 18px; height: 18px; border: 2.5px solid var(--on-accent); border-top-color: transparent; border-radius: 50%; animation: r .8s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

  /* modal */
  .overlay { position: fixed; inset: 0; background: rgba(8,12,10,.55); display: grid; place-items: center; padding: 16px; z-index: 30; }
  .modal { background: var(--card); border-radius: 16px; width: min(640px, 96vw); max-height: 86vh; overflow: auto; padding: 16px; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
  .gitem { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; cursor: pointer; aspect-ratio: 1; background: var(--bg); }
  .gitem img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gitem.sel { outline: 3px solid var(--accent); outline-offset: -1px; }

  #toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 99px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 40; max-width: 90vw; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <div class="head-in">
    <div class="mark">📦</div>
    <div>
      <h1 data-i18n="title">eBay Auto-Drafter</h1>
      <div class="tag" data-i18n="tagline">Photos in → draft listings out</div>
    </div>
    <div class="head-right">
      <span class="who hidden" id="who"></span>
      <span class="status hidden" id="status">…</span>
      <button class="linkbtn hidden" id="logout" data-i18n="logout">Sign out</button>
      <button class="lang" id="lang" aria-label="Language">ES</button>
    </div>
  </div>
</header>

<!-- ============ AUTH GATE ============ -->
<div class="shell" id="gate">
  <div class="authwrap">
    <div class="tabs">
      <button class="tab on" id="tab-signin" data-i18n="signIn">Sign in</button>
      <button class="tab" id="tab-signup" data-i18n="createAccount">Create account</button>
    </div>

    <!-- Sign in -->
    <div class="card" id="pane-signin">
      <div class="field"><label data-i18n="email">Email</label>
        <input type="email" id="li-email" autocomplete="email"></div>
      <div class="field"><label data-i18n="password">Password</label>
        <input type="password" id="li-pass" autocomplete="current-password"></div>
      <label class="check"><input type="checkbox" id="li-remember" checked> <span data-i18n="autoLogin">Keep me signed in (auto-login)</span></label>
      <button class="btn" id="li-go" data-i18n="signIn">Sign in</button>
      <p class="err" id="li-err"></p>
    </div>

    <!-- Sign up -->
    <div class="card hidden" id="pane-signup">
      <div class="field"><label data-i18n="email">Email</label>
        <input type="email" id="su-email" autocomplete="email" data-i18n-ph="realEmail" placeholder="you@example.com"></div>
      <div class="field"><label data-i18n="password">Password (min 8 characters)</label>
        <input type="password" id="su-pass" autocomplete="new-password"></div>
      <div class="field"><label id="cap-q" data-i18n="captcha">Verify you're human</label>
        <input type="text" id="su-cap" inputmode="numeric" autocomplete="off"></div>
      <label class="check"><input type="checkbox" id="su-remember" checked> <span data-i18n="autoLogin">Keep me signed in (auto-login)</span></label>
      <button class="btn" id="su-go" data-i18n="createAccount">Create account</button>
      <p class="err" id="su-err"></p>
      <div class="hidden" id="su-done"></div>
      <p class="fineprint" data-i18n="confirmNote">We'll send a confirmation link to make sure your email is real. You must confirm before signing in.</p>
    </div>
    <p class="fineprint" data-i18n="pitch">Your own auto-lister — like Vendoo or Flyp, but yours. Snap photos, get eBay drafts, crosslist anywhere.</p>
  </div>
</div>

<!-- ============ APP ============ -->
<div class="shell app-grid hidden" id="app">
  <div class="capture">
    <div class="card">
      <label data-i18n="importFrom">Add photos from</label>
      <div class="gbtns">
        <button class="gbtn photos" id="g-photos"><span class="dot"></span>🖼 <span data-i18n="googlePhotos">Google Photos</span></button>
        <button class="gbtn drive" id="g-drive"><span class="dot"></span>📁 <span data-i18n="googleDrive">Google Drive</span></button>
      </div>
      <p class="gnote" id="g-note"></p>

      <label for="name" data-i18n="nameLabel">Item name — hint for the AI</label>
      <input type="text" id="name" autocomplete="off" data-i18n-ph="namePh" placeholder='e.g. "nike hoodie XL"'>
      <input type="file" id="file" accept="image/*" multiple hidden>
      <button class="btn ghost" id="add">📷 <span data-i18n="addPhotos">Add photos from device</span></button>
      <div class="photos" id="photos"></div>
      <button class="btn" id="go" style="margin-top:12px" disabled><span data-i18n="create">Create draft</span></button>
    </div>
  </div>

  <div>
    <div class="feed-bar">
      <strong><span data-i18n="drafts">Drafts</span> <span class="mono" id="count"></span></strong>
      <a href="/api/drafts.csv" data-i18n="csv">Download CSV</a>
    </div>
    <div class="feed" id="feed"></div>
  </div>
</div>

<div id="toast" role="status"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
async function api(path, opts) {
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

/* ---------- i18n ---------- */
const STR = {
  en: {
    title: "eBay Auto-Drafter", tagline: "Photos in → draft listings out",
    signIn: "Sign in", createAccount: "Create account", email: "Email", password: "Password",
    autoLogin: "Keep me signed in (auto-login)", captcha: "Verify you're human", logout: "Sign out",
    realEmail: "you@example.com",
    confirmNote: "We'll send a confirmation link to make sure your email is real. You must confirm before signing in.",
    pitch: "Your own auto-lister — like Vendoo or Flyp, but yours. Snap photos, get eBay drafts, crosslist anywhere.",
    importFrom: "Add photos from", googlePhotos: "Google Photos", googleDrive: "Google Drive",
    nameLabel: "Item name — hint for the AI", namePh: 'e.g. "nike hoodie XL"',
    addPhotos: "Add photos from device", create: "Create draft", drafting: "Drafting… (can take a minute)",
    drafts: "Drafts", csv: "Download CSV", condition: "Condition", category: "Category", brand: "Brand",
    flaws: "Flaws", verify: "Verify before publishing", range: "range",
    copyTitle: "Copy title", copyDesc: "Copy description", copyAll: "Copy all", del: "Delete",
    copied: "Copied ✓", deleted: "Draft deleted", confirmDel: "Delete this draft?",
    live: "✅ Live AI", mock: "🧪 Mock mode", empty: "No drafts yet. Add photos and tap Create draft.",
    gSetup: "Ask the app owner to add Google credentials to enable this.",
    gConnect: "Connect", gConnected: "connected", gConnectedMsg: "Google connected ✓",
    pick: "Pick photos", importSel: "Import selected", loading: "Loading…", noItems: "Nothing found.",
    checkEmail: "Account created! Confirm your email to sign in:", openLink: "Open confirmation link",
    confirmFirst: "Confirm your email first — see the link below.",
  },
  es: {
    title: "eBay Auto-Drafter", tagline: "Fotos → borradores de anuncios",
    signIn: "Iniciar sesión", createAccount: "Crear cuenta", email: "Correo", password: "Contraseña",
    autoLogin: "Mantener sesión (auto-login)", captcha: "Verifica que eres humano", logout: "Cerrar sesión",
    realEmail: "tu@ejemplo.com",
    confirmNote: "Enviaremos un enlace de confirmación para verificar que tu correo es real. Debes confirmarlo antes de iniciar sesión.",
    pitch: "Tu propio auto-lister — como Vendoo o Flyp, pero tuyo. Toma fotos, obtén borradores de eBay, publica en todas partes.",
    importFrom: "Agregar fotos desde", googlePhotos: "Google Photos", googleDrive: "Google Drive",
    nameLabel: "Nombre del artículo — pista para la IA", namePh: 'ej. "sudadera nike XL"',
    addPhotos: "Agregar fotos del dispositivo", create: "Crear borrador", drafting: "Creando… (puede tardar)",
    drafts: "Borradores", csv: "Descargar CSV", condition: "Condición", category: "Categoría", brand: "Marca",
    flaws: "Defectos", verify: "Verificar antes de publicar", range: "rango",
    copyTitle: "Copiar título", copyDesc: "Copiar descripción", copyAll: "Copiar todo", del: "Eliminar",
    copied: "Copiado ✓", deleted: "Borrador eliminado", confirmDel: "¿Eliminar este borrador?",
    live: "✅ IA activa", mock: "🧪 Modo prueba", empty: "Aún no hay borradores. Agrega fotos y toca Crear borrador.",
    gSetup: "Pide al dueño de la app que agregue las credenciales de Google.",
    gConnect: "Conectar", gConnected: "conectado", gConnectedMsg: "Google conectado ✓",
    pick: "Elegir fotos", importSel: "Importar selección", loading: "Cargando…", noItems: "No se encontró nada.",
    checkEmail: "¡Cuenta creada! Confirma tu correo para iniciar sesión:", openLink: "Abrir enlace de confirmación",
    confirmFirst: "Confirma tu correo primero — mira el enlace abajo.",
  },
};
let lang = localStorage.getItem("lang") || "en";
const t = (k) => (STR[lang] && STR[lang][k]) || STR.en[k] || k;
function applyLang() {
  document.documentElement.lang = lang;
  $("lang").textContent = lang === "en" ? "ES" : "EN";
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-ph]").forEach((el) => { el.placeholder = t(el.dataset.i18nPh); });
  if (session) { renderStatus(); renderGoogle(); loadFeed(); }
}
$("lang").onclick = () => { lang = lang === "en" ? "es" : "en"; localStorage.setItem("lang", lang); applyLang(); };

/* ---------- toast ---------- */
let toastTimer;
function toast(msg) {
  const el = $("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}

/* ---------- session / gate ---------- */
let session = null;
async function loadSession() {
  session = await api("/api/session");
  if (session.authenticated) showApp();
  else showGate();
}
function showGate() {
  $("gate").classList.remove("hidden");
  $("app").classList.add("hidden");
  $("who").classList.add("hidden");
  $("status").classList.add("hidden");
  $("logout").classList.add("hidden");
  loadCaptcha();
}
function showApp() {
  $("gate").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("who").textContent = session.email;
  $("who").classList.remove("hidden");
  $("status").classList.remove("hidden");
  $("logout").classList.remove("hidden");
  renderStatus(); renderGoogle(); loadFeed();
  const g = new URLSearchParams(location.search).get("google");
  if (g && g !== "error") { toast(t("gConnectedMsg")); history.replaceState({}, "", "/"); }
}
function renderStatus() {
  const el = $("status");
  const live = session.hasApiKey && !session.mockDefault;
  el.className = "status" + (live ? " ok" : "");
  el.textContent = live ? t("live") : t("mock");
}

/* ---------- auth: tabs ---------- */
$("tab-signin").onclick = () => switchTab(true);
$("tab-signup").onclick = () => switchTab(false);
function switchTab(signin) {
  $("tab-signin").classList.toggle("on", signin);
  $("tab-signup").classList.toggle("on", !signin);
  $("pane-signin").classList.toggle("hidden", !signin);
  $("pane-signup").classList.toggle("hidden", signin);
}

/* ---------- captcha ---------- */
let captchaToken = null;
async function loadCaptcha() {
  try {
    const c = await api("/api/captcha");
    captchaToken = c.token;
    $("cap-q").textContent = c.question;
    $("su-cap").value = "";
  } catch {}
}

/* ---------- sign up ---------- */
$("su-go").onclick = async () => {
  $("su-err").textContent = "";
  try {
    const r = await api("/api/register", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({
        email: $("su-email").value, password: $("su-pass").value,
        captchaToken, captchaAnswer: $("su-cap").value,
      }),
    });
    const done = $("su-done");
    done.classList.remove("hidden");
    done.innerHTML = `<p class="ok-msg">${esc(t("checkEmail"))}</p>
      <a class="btn small" style="margin-top:8px;text-decoration:none" href="${esc(r.confirmLink)}" target="_blank">${esc(t("openLink"))}</a>`;
    $("su-go").classList.add("hidden");
  } catch (e) {
    $("su-err").textContent = e.message;
    loadCaptcha();
  }
};

/* ---------- sign in ---------- */
$("li-go").onclick = doLogin;
$("li-pass").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
async function doLogin() {
  $("li-err").textContent = "";
  try {
    await api("/api/login", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ email: $("li-email").value, password: $("li-pass").value, remember: $("li-remember").checked }),
    });
    await loadSession();
  } catch (e) {
    $("li-err").textContent = e.message;
  }
}
$("logout").onclick = async () => { await api("/api/logout", { method: "POST" }); location.href = "/"; };

/* ---------- Google connect ---------- */
function renderGoogle() {
  const g = session.google || {};
  const note = $("g-note");
  $("g-photos").classList.toggle("connected", g.photos);
  $("g-drive").classList.toggle("connected", g.drive);
  if (!g.configured) { note.textContent = t("gSetup"); }
  else { note.textContent = ""; }
}
$("g-photos").onclick = () => connectOrPick("photos");
$("g-drive").onclick = () => connectOrPick("drive");
function connectOrPick(service) {
  const g = session.google || {};
  if (!g.configured) { toast(t("gSetup")); return; }
  if (g[service]) openPicker(service);
  else location.href = "/auth/google/" + service;
}

/* ---------- Google picker modal ---------- */
let picked = new Set();
async function openPicker(service) {
  picked = new Set();
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `<div class="modal">
    <div class="modal-head"><strong>${service === "drive" ? t("googleDrive") : t("googlePhotos")}</strong>
      <button class="chipbtn" data-x>✕</button></div>
    <div id="gwrap" class="mono" style="color:var(--muted)">${t("loading")}</div>
    <button class="btn" id="gimport" style="margin-top:14px" disabled>${t("importSel")}</button>
  </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector("[data-x]").onclick = () => overlay.remove();
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  try {
    const { items } = await api("/api/google/" + service);
    const wrap = $("gwrap");
    if (!items.length) { wrap.textContent = t("noItems"); return; }
    wrap.className = "grid";
    wrap.innerHTML = "";
    items.forEach((it) => {
      const d = document.createElement("div");
      d.className = "gitem";
      d.innerHTML = `<img loading="lazy" src="${esc(it.thumb)}" alt="${esc(it.name || "")}">`;
      d.onclick = () => {
        const key = service === "drive" ? it.id : it.baseUrl;
        if (picked.has(key)) { picked.delete(key); d.classList.remove("sel"); }
        else { picked.add(key); d.classList.add("sel"); }
        $("gimport").disabled = picked.size === 0;
      };
      wrap.appendChild(d);
    });
    $("gimport").onclick = async () => {
      $("gimport").innerHTML = `<span class="spin"></span>`;
      for (const key of picked) {
        try {
          const body = service === "drive" ? { source: "drive", id: key } : { source: "photos", baseUrl: key };
          const img = await api("/api/google/import", {
            method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body),
          });
          photos.push({ media_type: img.media_type, data: img.data, dataUrl: `data:${img.media_type};base64,${img.data}`, name: "google" });
        } catch (e) { toast(e.message); }
      }
      overlay.remove();
      renderPhotos();
    };
  } catch (e) {
    $("gwrap").textContent = e.message;
  }
}

/* ---------- device photos ---------- */
let photos = [];
function renderPhotos() {
  const p = $("photos");
  p.innerHTML = "";
  photos.forEach((ph, i) => {
    const d = document.createElement("div");
    d.className = "thumb";
    d.innerHTML = `<img src="${ph.dataUrl}" alt=""><button aria-label="Remove">×</button>`;
    d.querySelector("button").onclick = () => { photos.splice(i, 1); renderPhotos(); };
    p.appendChild(d);
  });
  $("go").disabled = photos.length === 0;
}
function downscale(file, max, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(img.width * scale));
      c.height = Math.max(1, Math.round(img.height * scale));
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      const dataUrl = c.toDataURL("image/jpeg", quality);
      URL.revokeObjectURL(img.src);
      resolve(dataUrl);
    };
    img.onerror = () => { URL.revokeObjectURL(img.src); reject(new Error("bad image")); };
    img.src = URL.createObjectURL(file);
  });
}
async function addFiles(files) {
  for (const f of [...files].slice(0, 12 - photos.length)) {
    try {
      const dataUrl = await downscale(f, 1568, 0.85);
      photos.push({ media_type: "image/jpeg", data: dataUrl.split(",")[1], dataUrl, name: f.name });
    } catch {}
  }
  renderPhotos();
}
$("add").onclick = () => $("file").click();
$("file").onchange = (e) => { addFiles(e.target.files); e.target.value = ""; };
$("name").addEventListener("keydown", (e) => { if (e.key === "Enter" && !$("go").disabled) $("go").click(); });

/* ---------- draft cards ---------- */
function draftText(d) {
  const specs = d.item_specifics.map((s) => `${s.name}: ${s.value}`).join("\n");
  return `${d.title}\n\n$${d.price.suggested} (${d.price.low}–${d.price.high})\n${t("condition")}: ${d.condition}\n${t("category")}: ${d.category}\n${specs}\n\n${d.description}`;
}
function copy(text) {
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
    .then(() => toast(t("copied")))
    .catch(() => {
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); toast(t("copied")); } catch {}
      ta.remove();
    });
}
function draftCard(item, d, mock) {
  const el = document.createElement("div");
  el.className = "card draft";
  const specs = d.item_specifics.map((s) => `<dt>${esc(s.name)}</dt><dd>${esc(s.value)}</dd>`).join("");
  const flaws = d.flaws && d.flaws.length ? `<dt>${t("flaws")}</dt><dd>${esc(d.flaws.join("; "))}</dd>` : "";
  const thumb = d._meta && d._meta.thumb ? `<div class="dthumbs"><img src="${d._meta.thumb}" alt=""></div>` : "";
  el.innerHTML = `
    <h3>${esc(d.title)}</h3>
    <div class="pricerow"><span class="price mono">$${d.price.suggested}</span>
      <span class="range mono">${t("range")} $${d.price.low}–$${d.price.high}${mock ? " · mock" : ""}</span></div>
    <dl class="kv"><dt>${t("condition")}</dt><dd>${esc(d.condition)}</dd>
      <dt>${t("category")}</dt><dd>${esc(d.category)}</dd>
      <dt>${t("brand")}</dt><dd>${esc(d.brand)}</dd>${specs}${flaws}</dl>
    ${thumb}
    <div class="desc">${esc(d.description)}</div>
    ${d.confidence_notes ? `<div class="verify">⚠️ ${t("verify")}: ${esc(d.confidence_notes)}</div>` : ""}
    <div class="actions">
      <button class="chipbtn" data-a="title">📋 ${t("copyTitle")}</button>
      <button class="chipbtn" data-a="desc">📋 ${t("copyDesc")}</button>
      <button class="chipbtn" data-a="all">📋 ${t("copyAll")}</button>
      <button class="chipbtn del" data-a="del">🗑 ${t("del")}</button>
    </div>`;
  el.querySelector('[data-a="title"]').onclick = () => copy(d.title);
  el.querySelector('[data-a="desc"]').onclick = () => copy(d.description);
  el.querySelector('[data-a="all"]').onclick = () => copy(draftText(d));
  el.querySelector('[data-a="del"]').onclick = async () => {
    if (!confirm(t("confirmDel"))) return;
    await api("/api/drafts/" + encodeURIComponent(item), { method: "DELETE" });
    toast(t("deleted")); loadFeed();
  };
  return el;
}
async function loadFeed() {
  try {
    const { drafts } = await api("/api/drafts");
    const feed = $("feed");
    feed.innerHTML = "";
    $("count").textContent = drafts.length ? `(${drafts.length})` : "";
    if (!drafts.length) { feed.innerHTML = `<div class="card" style="color:var(--muted);font-size:14px">${esc(t("empty"))}</div>`; return; }
    for (const { item, draft } of drafts) feed.appendChild(draftCard(item, draft, draft._meta?.model === "mock"));
  } catch {}
}

/* ---------- create ---------- */
$("go").onclick = async () => {
  const btn = $("go");
  btn.disabled = true;
  btn.innerHTML = `<span class="spin"></span>&nbsp;${esc(t("drafting"))}`;
  try {
    const thumb = photos[0] ? await shrink(photos[0].dataUrl) : null;
    await api("/api/draft", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({
        name: $("name").value, thumb,
        photos: photos.map((p) => ({ media_type: p.media_type, data: p.data, name: p.name })),
      }),
    });
    photos = []; $("name").value = ""; renderPhotos();
    await loadFeed();
    window.scrollTo({ top: 0, behavior: "smooth" });
  } catch (err) {
    toast(err.message);
  } finally {
    btn.disabled = photos.length === 0;
    btn.innerHTML = `<span>${esc(t("create"))}</span>`;
  }
};
function shrink(dataUrl) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const MAX = 160, scale = Math.min(1, MAX / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(img.width * scale));
      c.height = Math.max(1, Math.round(img.height * scale));
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL("image/jpeg", 0.7));
    };
    img.onerror = () => resolve(null);
    img.src = dataUrl;
  });
}

applyLang();
loadSession();
</script>
</body>
